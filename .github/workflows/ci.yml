name: CI - Telecom Churn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dependances des controles
        run: python -m pip install pytest==9.2.0

      - name: Verifier la syntaxe Python
        run: python -m compileall -q app.py src tests

      - name: Tester le quality gate
        run: python -m pytest tests/test_quality_gate.py -v

      - name: Controler les metriques de validation enregistrees
        run: python src/check_quality.py